<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งรหัสเชิญ - บันทึกรายรับรายจ่าย SB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>บันทึกรายรับรายจ่าย SB</h1>
    <p class="tagline">ตั้งรหัสเชิญสำหรับสมัครสมาชิก (ทำครั้งเดียว) แล้วแชร์ให้คนที่อยากให้สมัครได้</p>

    <form id="setup-form">
      <label>
        รหัสเชิญ
        <input type="text" id="setup-invite-code" minlength="4" required autofocus>
      </label>
      <button type="submit">บันทึกและไปหน้าสมัครสมาชิก</button>
      <p id="setup-error" class="error hidden"></p>
    </form>
  </div>
</div>

<script>
document.getElementById("setup-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("setup-error");
  errEl.classList.add("hidden");
  try {
    const res = await fetch("/api/auth/setup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ invite_code: document.getElementById("setup-invite-code").value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "บันทึกไม่สำเร็จ");
    window.location.href = "/register";
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove("hidden");
  }
});
</script>
</body>
</html>

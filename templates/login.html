<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function () {
  var t = localStorage.getItem("theme");
  if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
})();
</script>
<title>เข้าสู่ระบบ - บันทึกรายรับรายจ่าย SB</title>
<link rel="icon" type="image/png" sizes="32x32" href="{{ static_url('favicon-32.png') }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ static_url('favicon-192.png') }}">
<link rel="apple-touch-icon" href="{{ static_url('apple-touch-icon.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="{{ static_url('style.css') }}">
</head>
<body>
<button type="button" id="theme-toggle-btn" class="secondary theme-toggle-fixed" title="สลับธีมสว่าง/มืด (Toggle theme)">🌙</button>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>บันทึกรายรับรายจ่าย SB</h1>

    <form id="login-form">
      <label>
        ชื่อผู้ใช้
        <input type="text" id="login-username" autofocus required>
      </label>
      <label>
        รหัสผ่าน
        <input type="password" id="login-password" required>
      </label>
      <button type="submit">เข้าสู่ระบบ</button>
      <p id="login-error" class="error hidden"></p>
    </form>
    <p class="hint">ยังไม่มีบัญชี? <a href="/register">สมัครสมาชิก</a></p>
  </div>
</div>

<script>
(function () {
  function currentTheme() {
    return (
      document.documentElement.getAttribute("data-theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
    );
  }
  var btn = document.getElementById("theme-toggle-btn");
  btn.textContent = currentTheme() === "dark" ? "☀️" : "🌙";
  btn.addEventListener("click", function () {
    var next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    btn.textContent = next === "dark" ? "☀️" : "🌙";
  });
})();

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errEl = document.getElementById("login-error");
  errEl.classList.add("hidden");
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("login-username").value.trim(),
        password: document.getElementById("login-password").value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "เข้าสู่ระบบไม่สำเร็จ");
    window.location.href = "/";
  } catch (err) {
    errEl.textContent = err.message;
    errEl.classList.remove("hidden");
  }
});
</script>
</body>
</html>
